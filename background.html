<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .area {
        width: 100%;
        /* height: 500px; <- 이미지 넣은 후 보이지 않아 임의로 설정했었음 */
        aspect-ratio: 509/339;
        background-image: url("images/dog.jpg");
        background-repeat: no-repeat;
        background-size: 100%;
      }
      .part {
        width: 100%;
        aspect-ratio: 33/32;
        /* height: 500px; */
        background-image: url("images/dot.png");
        background-repeat: no-repeat;
        background-size: 100%;
      }
    </style>
  </head>
  <body>
    <div class="area"></div>
    <!-- 새로운 영역 -->
    <div class="part"></div>
  </body>
</html>
